name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: queueforge
          POSTGRES_PASSWORD: queueforge
          POSTGRES_DB: queueforge
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U queueforge -d queueforge"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Throwaway credentials of the CI service container above.
      QUEUEFORGE_DSN: postgresql://queueforge:queueforge@127.0.0.1:55432/queueforge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q
      - name: Demo
        run: uv run queueforge demo
      - name: Audit locked dependencies
        run: |
          uv export --locked --format requirements-txt --no-emit-project -o "$RUNNER_TEMP/requirements-audit.txt"
          uvx pip-audit@2.10.1 --strict --disable-pip -r "$RUNNER_TEMP/requirements-audit.txt"
