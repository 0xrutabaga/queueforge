name: queueforge

services:
  postgres:
    image: postgres:17
    environment:
      # Local development credentials only. Never reuse them anywhere else.
      POSTGRES_USER: queueforge
      POSTGRES_PASSWORD: queueforge
      POSTGRES_DB: queueforge
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueforge -d queueforge"]
      interval: 2s
      timeout: 5s
      retries: 30
